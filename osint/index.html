<html lang="en">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<style>
/* Light, institutional style after research tools such as OSoMe Coordiscope/Botometer, OpenSanctions and Our World in Data */
:root { color-scheme: light; --bg: #ffffff; --panel: #f6f7f9; --panel-2: #eef0f3; --rule: #d9dde3; --grid: #eceef1;
  --text-primary: #1b1f24; --text-secondary: #3d434b; --text-muted: #6a717b;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --other: #a3a9b1; --surface-1: #ffffff; --line: #d9dde3;
  --navy: #13294b; --link: #1a5fb4;
  --font: "Source Sans 3", "Helvetica Neue", Arial, sans-serif; --serif: "Source Serif 4", Georgia, serif; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text-primary); font-family: var(--font); line-height: 1.5; font-size: 16px; }
a { color: var(--link); text-underline-offset: 2px; }
a:hover { color: var(--navy); }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 24px; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
p { color: var(--text-secondary); }
b, strong { color: var(--text-primary); font-weight: 600; }
h1 { font-family: var(--serif); font-size: 30px; line-height: 1.2; font-weight: 600; margin: 0 0 8px; word-break: break-word; }
h2 { font-family: var(--serif); font-size: 21px; line-height: 1.25; font-weight: 600; margin: 0 0 4px; }
h3 { font-size: 16px; font-weight: 600; margin: 0 0 4px; }
.muted { color: var(--text-muted); }
code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .88em; background: var(--panel-2); padding: 1px 5px; border-radius: 2px; color: var(--text-primary); }

/* header: solid bar in the one brand color */
header.bar { background: var(--navy); color: #fff; }
header.bar .wrap { display: flex; align-items: center; gap: 18px; height: 52px; }
.brand { color: #fff; font-weight: 700; text-decoration: none; font-size: 18px; white-space: nowrap; }
.brand:hover { color: #fff; }
.tagline { color: #b9c4d6; font-size: 14px; white-space: nowrap; border-left: 1px solid #3a4f73; padding-left: 14px; }
header nav { display: flex; gap: 22px; margin-left: auto; }
header nav a { color: #dfe6f1; text-decoration: none; font-size: 15px; padding: 15px 0 13px; border-bottom: 3px solid transparent; }
header nav a:hover { color: #fff; }
header nav a.on { color: #fff; border-bottom-color: #fff; font-weight: 600; }
@media (max-width: 760px) { .tagline { display: none; } }

/* form controls, plain and standard */
select, input, button { background: #fff; color: var(--text-primary); border: 1px solid #b8bec7; border-radius: 3px; padding: 6px 10px; font: inherit; font-size: 15px; }
select { padding-right: 28px; cursor: pointer; appearance: none; max-width: 100%;
  background-image: linear-gradient(45deg, transparent 50%, #555 50%), linear-gradient(135deg, #555 50%, transparent 50%);
  background-position: calc(100% - 14px) 52%, calc(100% - 9px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
input:focus, select:focus { border-color: var(--link); outline: 0; box-shadow: 0 0 0 2px rgba(26,95,180,.2); }
button { cursor: pointer; background: #fff; color: var(--link); border-color: var(--link); }
button:hover { background: var(--link); color: #fff; }
button[disabled] { color: #999; border-color: #ccc; background: #fff; }
.controls { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; padding: 18px 0 14px; }
.controls label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; font-weight: 600; color: var(--text-primary); }
.controls .grow { flex: 1; min-width: 200px; }
.controls .grow input { width: 100%; }
.notice { font-size: 14px; color: #5c4400; background: #fff8e1; border: 1px solid #ecd18c; border-radius: 3px; padding: 8px 12px; margin: 0 0 16px; }
.notice b { color: #5c4400; }

/* key figures */
.summary { display: flex; flex-wrap: wrap; gap: 6px 32px; padding: 10px 0; margin-bottom: 8px; border-bottom: 1px solid var(--rule); }
.summary div { font-size: 13px; color: var(--text-muted); }
.summary b { display: block; font-size: 20px; font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* sections sit on the page, separated by a rule (no cards) */
.panel { padding: 22px 0 18px; border-bottom: 1px solid var(--rule); }
.panel > p.sub, .panel .sub { font-size: 15px; color: var(--text-muted); margin: 0 0 14px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 40px; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }

/* tags: small bordered boxes in monospace */
.pill { display: inline-block; font: 12px/1.6 ui-monospace, Menlo, Consolas, monospace; padding: 0 5px; border: 1px solid #c9ced6; border-radius: 2px;
  background: #fff; color: #4a5059; white-space: nowrap; text-decoration: none; margin: 1px 3px 1px 0; }
a.pill { color: var(--link); } a.pill:hover { border-color: var(--link); }
.pill.bad { color: #a3261c; border-color: #efb7b1; background: #fdf3f2; }
.pill.ok { color: #1d6b3a; border-color: #a9d8b8; background: #f1faf4; }

/* tables */
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; color: var(--text-primary); font-weight: 600; padding: 8px 10px; border-bottom: 2px solid var(--rule); font-size: 14px; white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--grid); color: var(--text-secondary); vertical-align: top; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.n { color: var(--text-primary); }
.scroll { overflow-x: auto; }
footer { padding: 24px 0 40px; font-size: 14px; color: var(--text-muted); border-top: 1px solid var(--rule); margin-top: 40px; background: var(--panel); }
#tip { position: fixed; pointer-events: none; background: #fff; border: 1px solid #b8bec7; color: var(--text-primary); box-shadow: 0 2px 6px rgba(0,0,0,.12);
  padding: 6px 9px; border-radius: 3px; font-size: 14px; line-height: 1.4; opacity: 0; transition: opacity .1s; z-index: 50; max-width: 320px; }
#tip .m { color: var(--text-muted); }

/* explore page */
.intro { padding: 8px 0 18px; }
.intro p { font-size: 17px; max-width: 46em; }
.intro p.big { font-size: 20px; color: var(--text-primary); }
.how { display: flex; gap: 24px; flex-wrap: wrap; padding: 0; margin: 14px 0 0; list-style: none; counter-reset: h; font-size: 15px; color: var(--text-secondary); }
.how li { counter-increment: h; flex: 1; min-width: 200px; }
.how li::before { content: counter(h); display: inline-block; width: 22px; height: 22px; border-radius: 50%; background: var(--navy); color: #fff; text-align: center; font-size: 13px; line-height: 22px; margin-right: 8px; font-weight: 700; }
.card { border: 1px solid var(--rule); border-radius: 4px; padding: 16px 18px; margin-bottom: 12px; }
.cardtop { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.cardtop h2 { font-size: 20px; margin: 0; }
.cardtop h2 a { color: var(--text-primary); text-decoration: none; }
.cardtop h2 a:hover { text-decoration: underline; }
.rank { color: var(--text-muted); font-size: 14px; font-weight: 600; }
.topic { font-size: 13px; color: var(--text-secondary); background: var(--panel-2); padding: 1px 8px; border-radius: 10px; }
.say { font-size: 16px; color: var(--text-primary); margin: 8px 0 10px; word-break: break-word; }
.say q, .big q, .proofs q { font-style: italic; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.chip { font-size: 14px; padding: 2px 10px; border-radius: 12px; background: #eaf2fc; color: #174a86; cursor: help; }
.chip.real { background: #eaf6ee; color: #1d6b3a; }
.meterrow { display: flex; align-items: center; gap: 12px; font-size: 15px; color: var(--text-secondary); cursor: help; margin: 6px 0; }
.meter { width: 160px; height: 10px; background: var(--panel-2); border-radius: 5px; overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; background: var(--series-2); }
.answer { font-size: 15px; color: #1d6b3a; margin: 6px 0 0; }
.open { display: inline-block; margin-top: 10px; font-weight: 600; }
.checks, .proofs { list-style: none; padding: 0; margin: 0; }
.checks li { display: grid; grid-template-columns: 28px 220px minmax(0, 1fr); gap: 4px 10px; padding: 10px 0; border-bottom: 1px solid var(--grid); align-items: baseline; }
.checks .tick { width: 22px; height: 22px; border-radius: 50%; background: #eaf2fc; color: #174a86; text-align: center; line-height: 22px; font-weight: 700; }
.checks li.real .tick { background: #eaf6ee; color: #1d6b3a; }
.checks span:last-child { color: var(--text-secondary); }
@media (max-width: 700px) { .checks li { grid-template-columns: 28px 1fr; } .checks span:last-child { grid-column: 2; } }
.proofs li { padding: 10px 0; border-bottom: 1px solid var(--grid); font-size: 16px; word-break: break-word; }
.hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; height: 120px; align-items: end; border-bottom: 1px solid var(--rule); max-width: 760px; }
.hours div { height: 100%; display: flex; align-items: flex-end; cursor: help; }
.hours i { display: block; width: 100%; background: var(--series-1); border-radius: 2px 2px 0 0; }
.hourlbl { position: relative; height: 22px; font-size: 13px; color: var(--text-muted); max-width: 760px; }
.hourlbl span { position: absolute; top: 4px; }
details.expert { margin-top: 24px; border: 1px solid var(--rule); border-radius: 4px; padding: 12px 16px; }
details.expert > summary { font-size: 16px; font-weight: 600; color: var(--link); }
details.expert[open] > summary { margin-bottom: 12px; }
.crumb { font-size: 14px; color: var(--text-muted); margin: 18px 0 10px; }
.crumb a { color: var(--text-muted); }
.ghead { display: flex; gap: 20px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.ghead p { margin: 4px 0 0; max-width: 62em; }
.exports { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--text-muted); }
.exports button { padding: 5px 10px; font-size: 13px; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--panel); }
td.trace { max-width: 0; width: 46%; }
td.trace div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kind { font-size: 14px; color: var(--text-secondary); }
.hint { border-bottom: 1px dotted currentColor; cursor: help; }
.str { display: inline-block; font-size: 13px; font-weight: 600; padding: 0 6px; border-radius: 2px; border: 1px solid; }
.str.strong { color: #a3261c; border-color: #efb7b1; background: #fdf3f2; }
.str.moderate { color: #8a5a00; border-color: #ecd18c; background: #fff8e1; }
.str.weak { color: #4a5059; border-color: transparent; background: none; font-weight: 400; padding: 0; }
.pager { display: flex; gap: 10px; align-items: center; justify-content: flex-end; padding: 12px 0 0; font-size: 13px; color: var(--text-muted); }
.pager button { padding: 5px 12px; }
.pager button[disabled] { opacity: .4; cursor: default; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; word-break: break-all; }
.key { border-top: 1px solid var(--rule); padding: 12px 0; }
.key:first-child { border-top: 0; padding-top: 0; }
.key .txt { color: var(--text-primary); white-space: pre-wrap; word-break: break-word; margin-top: 4px; }
.posts { margin: 6px 0 0; font-size: 13px; border-left: 2px solid var(--rule); padding-left: 12px; }
.posts div { padding: 3px 0; color: var(--text-secondary); word-break: break-word; }
details summary { cursor: pointer; color: var(--text-muted); font-size: 13px; margin-top: 4px; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.net { position: relative; height: 420px; border: 1px solid var(--rule); background: #fbfcfd; }
.net svg { width: 100%; height: 100%; display: block; }
.netinfo { position: absolute; left: 10px; bottom: 10px; background: #fff; border: 1px solid var(--rule); border-radius: 4px; padding: 8px 12px; font-size: 13px; color: var(--text-muted); }
.netinfo b { font-size: 13px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--text-secondary); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
.heat { display: grid; grid-template-columns: 32px repeat(24, 1fr); gap: 2px; font-size: 11px; color: var(--text-muted); }
.heat div { height: 16px; border-radius: 2px; }
.heat .l { background: none; height: auto; line-height: 16px; }
svg text { fill: var(--text-muted); font-size: 11px; font-family: var(--font); }
.hits a { display: block; padding: 8px 0; border-bottom: 1px solid var(--rule); text-decoration: none; }
.hits a:hover { color: var(--series-1); }
</style>
</head>
<body>
<header class="bar"><div class="wrap">
  <a class="brand" href="index.html">PropNET</a><span class="tagline">Find accounts that act together</span>
  <nav><a class="on" href="index.html">Explore</a><a class="proj" href="results.html">Results</a><a class="proj" href="method.html">Method</a></nav>
</div></header>
<div class="wrap">
  <div class="controls">
    <label>Dataset <select id="ds" aria-label="Dataset"></select></label>
    <label class="grow">Find an account or word <input id="q" type="search" placeholder="Type a name, link or #hashtag and press Enter"></label>
    <span id="filters" style="display:contents"></span>
  </div>
  <div class="notice"><b>Copying isn't always bad.</b> Fans, news feeds and friends can act alike too. Look at the proof and decide for yourself.</div>
</div>
<main class="wrap" id="app"><p class="muted">Loading…</p></main>
<footer><div class="wrap">PropNET, a prairehack26 project. Public posts only. <a class="proj" href="method.html">How it works</a></div></footer>
<div id="tip"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ext = (url, text) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${text}</a>` : text;
const day = t => new Date(t * 1000).toISOString().slice(0, 10);
const when = t => new Date(t * 1000).toISOString().slice(0, 16).replace('T', ' ') + ' UTC';
const num = n => (n ?? 0).toLocaleString('en-US');
const enc = encodeURIComponent;
let D = null, name = null, U = {}, K = {}, page = 0;   // dataset, its name, account index, key index, list page
const PER_PAGE = 25;

// ---------- links to the source platform ----------
function postUrl(id, user) {
  if (D.platform === 'bluesky') {
    const m = /^at:\/\/([^/]+)\/([^/]+)\/([^/]+)$/.exec(id || '');
    if (!m) return null;
    return m[2] === 'app.bsky.feed.post' ? `https://bsky.app/profile/${m[1]}/post/${m[3]}` : `https://bsky.app/profile/${m[1]}`;
  }
  if (D.platform === 'x') return `https://x.com/${enc(user)}/status/${enc(id)}`;
  return null;
}
function profileUrl(u) {
  if (D.platform === 'bluesky') return `https://bsky.app/profile/${u}`;
  if (D.platform === 'x') return `https://x.com/${enc(u)}`;
  return null;
}
const archive = url => url ? `https://web.archive.org/web/*/${url}` : null;
const who = u => { const m = U[u]?.m; return m?.handle ? '@' + m.handle : (D.platform === 'x' ? '@' + u : u.slice(0, 18) + (u.length > 18 ? '…' : '')); };

// A key is what members share: kind + value. Returns {label, url, text} for display.
function keyInfo(k) {
  if (k.kind === 'dup') return { label: 'same text', url: null, text: k.sample || k.key };
  if (k.kind === 'tgt') {
    const m = /:(at:\/\/.+)$/.exec(k.key), url = m ? postUrl(m[1]) : null;
    return { label: 'replied to', url, text: m ? 'post ' + m[1].split('/').pop() + ' by ' + who(m[1].slice(5).split('/')[0]) : k.key };
  }
  const v = k.key;
  if (v.startsWith('url:')) return { label: 'link', url: 'https://' + v.slice(4), text: v.slice(4) };
  if (v.startsWith('rt:')) {
    const at = v.slice(3), did = at.slice(5).split('/')[0];
    return { label: 'repost of', url: postUrl(at), text: 'post by ' + (U[did] ? who(did) : did) };
  }
  if (v.startsWith('#')) return { label: 'hashtag', url: D.platform === 'bluesky' ? `https://bsky.app/hashtag/${enc(v.slice(1))}`
    : D.platform === 'x' ? `https://x.com/hashtag/${enc(v.slice(1))}` : null, text: v };
  if (v.startsWith('@')) return { label: 'mention', url: profileUrl(v.slice(1)), text: v.startsWith('@did:') ? who(v.slice(1)) : v };
  return { label: k.kind, url: null, text: v };
}
const keyHref = k => `#/${enc(name)}/k/${k.kind}/${enc(k.key)}`;

// ---------- data loading ----------
// script tags, not fetch, so the page also works from file://; ?time skips the browser cache (monitor.py rewrites the files)
function script(file) {
  return new Promise((ok, fail) => {
    const s = document.createElement('script');
    s.src = file + '?' + Date.now(); s.onload = ok; s.onerror = () => fail(file);
    document.head.appendChild(s);
  });
}
async function load(n) { if (!window.SITE?.[n]) await script(enc(n) + '.js'); return window.SITE[n]; }
function index() {
  U = {}; K = {};
  for (const g of D.groups) {
    for (const m of g.members) U[m.id] = { m, g };
    for (const k of g.keys) (K[k.kind + '\u0000' + k.key] ||= []).push({ g, k });
  }
}

// ---------- layout helpers ----------
const NAMES = { bluesky: 'Bluesky: the last 24 hours', iowa: 'Bluesky: Iowa election accounts', x: 'X (Twitter): Russian troll accounts' };
const ABOUT = { bluesky: 'everything posted on Bluesky in the last 24 hours',
  iowa: 'Bluesky accounts around the Iowa election, Oct 27 to Nov 10, 2026', x: 'known Russian troll accounts on Twitter, 2012 to 2018' };
const panel = (title, sub, body) => `<section class="panel"><h2>${title}</h2>${sub ? `<p class="sub">${sub}</p>` : ''}${body}</section>`;
const crumb = (...links) => `<p class="crumb"><a href="#/${enc(name)}">All groups</a>${links.map(l => ' / ' + l).join('')}</p>`;
const summary = items => `<div class="summary">${items.map(([v, l]) => `<div><b>${v}</b>${l}</div>`).join('')}</div>`;
// Strength: the group's rank among ALL groups found (groups are sorted by score, so rank g.g of n_groups is exact).
// Shown as "Top X%" (rank, not a probability); top 1% and top 5% are highlighted. The raw score stays in the tooltip and exports.
const pctAbove = g => (D.n_groups - g.g) / D.n_groups;
const tier = g => { const p = pctAbove(g); return p >= .99 ? 'strong' : p >= .95 ? 'moderate' : 'weak'; };
const topPct = g => { const t = (g.g / D.n_groups) * 100; return 'Top ' + (t < 1 ? (t < .1 ? '0.1' : t.toFixed(1)) : Math.ceil(t)) + '%'; };
const strengthCell = g => `<span class="str ${tier(g)}" title="Rank ${g.g} of ${num(D.n_groups)} groups found (raw score ${g.score.toFixed(1)}). A ranking, not a probability.">${topPct(g)}</span>`;
// What the answer key says about a group, where the data has one (X: troll role; Telegram: propaganda label)
function known(g) {
  const cats = g.members.map(m => m.category).filter(Boolean);
  if (cats.length) { const c = {}; cats.forEach(x => c[x] = (c[x] || 0) + 1); const [best, n] = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    return { text: `${best} ${Math.round(n / cats.length * 100)}%`, title: `${n} of ${cats.length} accounts with a known role are ${best}` }; }
  const lab = g.members.filter(m => typeof m.label === 'boolean');
  if (lab.length) { const n = lab.filter(m => m.label).length; return { text: `${Math.round(n / lab.length * 100)}% labeled`, title: `${n} of ${lab.length} accounts are labeled propaganda` }; }
  return null;
}
// Short explanations shown when hovering a column heading or a figure
const HELP = {
  kind: 'The topic of the group\'s posts (political, scam, porn or other), from a small language model. It describes the topic, not who runs the group.',
  tags: 'Signs from public account facts. Red: bot signs such as new accounts, same names or template bios. Green: signs of a real community.',
  accounts: 'Number of accounts in the group.',
  strength: 'The group\'s rank among all groups found, by shared content per member. Top 1% is red, top 5% yellow. A ranking, not a probability: a lower group can still be a real network.',
  known: 'What the answer key says, where the data has one. On X: the share of the group with its most common troll role.',
  schedule: 'How alike the members\' weekly posting hours are, from 0 (nothing alike) to 1 (identical). Real people keep different hours; operators often work the same shift.',
  trace: 'The thing the most members share: the same text, link, hashtag, mention, repost or reply target. ×N is how many members share it.',
};
const hint = (key, text, cls = '') => `<span class="hint ${cls}" tabindex="0" data-tip="${esc(HELP[key])}">${text}</span>`;
const tagPills = t => t.map(x => `<span class="pill ${['likely-community', 'disclosed'].includes(x) ? 'ok' : 'bad'}">${esc(x)}</span>`).join('');
const setFilters = html => $('filters').innerHTML = html;

// ---------- views ----------
// ---------- plain language (the main pages speak in sentences, not numbers) ----------
const TOPIC = { political: 'Politics', scam: 'Scam', porn: 'Adult content', other: 'Other topics' };
const CLUE_TAGS = {
  hidden: ['Hidden bot group', 'Several bot signs together, and they never say they are bots.'],
  'new-accounts': ['Brand-new accounts', 'Most of the accounts were made in the same two weeks.'],
  'same-name': ['Same name', 'Most of the accounts use the same display name.'],
  'template-bio': ['Copy-paste profiles', 'Their profile descriptions are almost the same.'],
  'blank-profiles': ['Empty profiles', 'Most accounts have no name and no description.'],
  'gone-accounts': ['Deleted accounts', 'Many of the accounts were deleted or banned after posting.'],
  'high-volume': ['Posts nonstop', 'New accounts with few followers that post a lot every day.'],

};
const REAL_TAGS = {
  'likely-community': ['Looks like real people', 'Old accounts with real, different profiles. This may be a real community.'],
  disclosed: ['Says it is a bot', 'Their profiles say they are bots, news feeds or official accounts.'],

const plural = (n, one, many) => `${num(n)} ${n === 1 ? one : many}`;
// The clues a group shows, in plain words. Each: [title, explanation]
function clues(g) {
  const out = [];
  if (g.shared?.dup) out.push(['Same words', `${plural(g.shared.dup, 'post was', 'posts were')} copied word for word by two or more of them.`]);
  if (g.shared?.item) out.push(['Same links and hashtags', `They shared the same links, hashtags, mentions or reposts ${plural(g.shared.item, 'time', 'times')}.`]);
  if (g.keys.some(k => k.kind === 'tgt')) out.push(['Reply to the same posts', 'They keep replying to the same posts.']);
  if (g.edges.some(e => e.fast > 0)) out.push(['Same minute', 'They often post the same thing less than a minute apart.']);
  if (g.sched_sim >= .5) out.push(['Same hours', g.sched_sim >= .8 ? 'They are online at almost exactly the same hours, like workers on one shift.' : 'They are online at similar hours of the week.']);
  for (const t of g.tags) if (CLUE_TAGS[t]) out.push(CLUE_TAGS[t]);

}
const realSigns = g => g.tags.filter(t => REAL_TAGS[t]).map(t => REAL_TAGS[t]);
// "copies more than N of every 100 groups we found" (rank among all groups found; a ranking, not a probability)
const beats = g => Math.max(0, Math.floor(pctAbove(g) * 100));
const meter = g => `<div class="meterrow" data-tip="${esc(`Rank ${g.g} of ${num(D.n_groups)} groups found. This compares groups with each other. It is not the chance that they are fake.`)}">
  <div class="meter" aria-hidden="true"><i style="width:${beats(g)}%"></i></div>
  <span>Copies more than <b>${beats(g)}</b> of every 100 groups we found</span></div>`;
// one sentence about the thing most members share
function proof(k) {
  const n = `${k.users} of them`;
  if (k.kind === 'dup') return `${n} posted the exact same words: <q>${esc((k.sample || '').slice(0, 140))}${(k.sample || '').length > 140 ? '…' : ''}</q>`;
  if (k.kind === 'tgt') { const i = keyInfo(k); return `${n} replied to the same ${ext(i.url, 'post')}.`; }
  const v = k.key;
  if (v.startsWith('url:')) return `${n} shared the same link: ${ext('https://' + v.slice(4), esc(v.slice(4).split('/')[0]))}`;
  if (v.startsWith('#')) return `${n} used the same hashtag: <b>${esc(v)}</b>`;
  if (v.startsWith('@')) return `${n} mentioned the same account: <b>${esc(keyInfo(k).text)}</b>`;
  if (v.startsWith('rt:')) return `${n} reposted the same ${ext(keyInfo(k).url, 'post')}.`;
  return `${n} share: ${esc(keyInfo(k).text)}`;
}
// The proof list: links to the same website are merged into one line, so a site with many pages isn't repeated
function proofItems(g, max = 6) {
  const out = [], byHost = {};
  for (const k of g.keys) {
    if (k.kind === 'item' && k.key.startsWith('url:')) {
      const host = k.key.slice(4).split('/')[0];
      if (byHost[host]) { const it = byHost[host]; it.n++; it.users = Math.max(it.users, k.users); it.posts.push(...(k.posts || []));
        it.html = `${it.users} of them shared links to <b>${it.n}</b> different pages on ${ext('https://' + host, esc(host))}`; continue; }
      if (out.length >= max) continue;
      byHost[host] = { html: proof(k), posts: [...(k.posts || [])], n: 1, users: k.users }; out.push(byHost[host]); continue;
    }
    if (out.length < max) out.push({ html: proof(k), posts: k.posts || [] });

}
const ROLE = { RightTroll: 'right-wing trolls', LeftTroll: 'left-wing trolls', NonEnglish: 'non-English trolls', NewsFeed: 'fake local-news accounts',

function answer(g) {
  const cats = g.members.map(m => m.category).filter(Boolean);
  if (cats.length) { const c = {}; cats.forEach(x => c[x] = (c[x] || 0) + 1); const [best, n] = Object.entries(c).sort((a, b) => b[1] - a[1])[0];
    return `<b>${n} of ${cats.length}</b> are known ${esc(role(best))}.`; }

  if (lab.length) return `<b>${lab.filter(m => m.label).length} of ${lab.length}</b> are known propaganda accounts.`;

}

// "What time they post": 24 bars, one per hour of the day

}

// ---------- network canvas (force layout, like Coordiscope) ----------
function network(g) {
  const el = $('net'), W = Math.max(300, el.clientWidth), H = el.clientHeight;
  const ids = g.members.map(m => m.id), at = new Map(ids.map((id, i) => [id, i]));
  // keep each account's strongest links (not just the strongest overall), so the picture shows structure, not one blob
  const kept = new Array(ids.length).fill(0), edges = [];
  for (const e of [...g.edges].sort((a, b) => b.w - a.w)) {
    if (!at.has(e.u) || !at.has(e.v)) continue;
    const s = at.get(e.u), t = at.get(e.v);
    if ((kept[s] < 3 || kept[t] < 3) && edges.length < 500) { edges.push({ s, t, w: e.w }); kept[s]++; kept[t]++; }
  }
  const n = ids.length, maxW = Math.max(...edges.map(e => e.w), 1e-9);

  const top = Object.keys(cats).sort((a, b) => cats[b] - cats[a]).slice(0, 3), pal = ['var(--series-1)', 'var(--series-2)', 'var(--series-3)'];
  const color = m => { const c = truth(m); return c == null ? 'var(--series-1)' : top.includes(c) ? pal[top.indexOf(c)] : 'var(--other)'; };
  $('netlegend').innerHTML = top.length ? top.map((c, i) => `<span><i style="background:${pal[i]}"></i>${esc(role(c).replace(/^./, x => x.toUpperCase()))}</span>`).join('') +
    (Object.keys(cats).length > 3 ? '<span><i style="background:var(--other)"></i>Other</span>' : '') : '';
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const P = ids.map(() => ({ x: W / 2 + (rnd() - .5) * W * .6, y: H / 2 + (rnd() - .5) * H * .6 }));
  const k = Math.sqrt(W * H / Math.max(n, 1)) * .55, iters = n > 150 ? 150 : 300;
  for (let it = 0; it < iters; it++) { const cool = 1 - it / iters, F = P.map(() => [0, 0]);
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) { const dx = P[i].x - P[j].x, dy = P[i].y - P[j].y, f = k * k / (dx * dx + dy * dy + .01) * .05;
      F[i][0] += dx * f; F[i][1] += dy * f; F[j][0] -= dx * f; F[j][1] -= dy * f; }
    for (const e of edges) { const a = P[e.s], b = P[e.t], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) + .01, f = (d - k) / d * .02 * (.4 + .6 * e.w / maxW);
      F[e.s][0] += dx * f; F[e.s][1] += dy * f; F[e.t][0] -= dx * f; F[e.t][1] -= dy * f; }
    P.forEach((p, i) => { F[i][0] += (W / 2 - p.x) * .004; F[i][1] += (H / 2 - p.y) * .004;
      p.x += Math.max(-20, Math.min(20, F[i][0])) * cool; p.y += Math.max(-20, Math.min(20, F[i][1])) * cool; }); }
  const xs = P.map(p => p.x), ys = P.map(p => p.y), pad = 20, a0 = Math.min(...xs), a1 = Math.max(...xs), b0 = Math.min(...ys), b1 = Math.max(...ys);
  const sc = Math.min((W - 2 * pad) / ((a1 - a0) || 1), (H - 2 * pad) / ((b1 - b0) || 1));
  P.forEach(p => { p.x = W / 2 + (p.x - (a0 + a1) / 2) * sc; p.y = H / 2 + (p.y - (b0 + b1) / 2) * sc; });
  const deg = new Array(n).fill(0); edges.forEach(e => { deg[e.s]++; deg[e.t]++; });
  let s = edges.map(e => `<line x1="${P[e.s].x.toFixed(1)}" y1="${P[e.s].y.toFixed(1)}" x2="${P[e.t].x.toFixed(1)}" y2="${P[e.t].y.toFixed(1)}" stroke="var(--text-muted)" stroke-opacity="${(.1 + .45 * e.w / maxW).toFixed(2)}" stroke-width="${(1 + 1.5 * e.w / maxW).toFixed(1)}"/>`).join('');
  s += g.members.map((m, i) => `<a href="#/${enc(name)}/u/${enc(m.id)}"><circle data-tip="${esc(`<b>${esc(who(m.id))}</b><br>${deg[i]} links · ${m.posts} posts here` + (truth(m) ? `<br><span class="m">${esc(truth(m))}</span>` : ''))}" cx="${P[i].x.toFixed(1)}" cy="${P[i].y.toFixed(1)}" r="${(4 + Math.min(7, Math.sqrt(deg[i]))).toFixed(1)}" fill="${color(m)}" stroke="#fff" stroke-width="1.5"/></a>`).join('');
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Network of group ${g.g}">${s}</svg>
    <div class="netinfo"><b>${n}</b> accounts · <b>${edges.length}</b> strongest links shown</div>`;
}

function timeline(g) {
  if (!g.timeline.length) return '<p class="muted">No posts.</p>';
  const first = {};
  for (const [u, t, s] of g.timeline) if (s && (first[u] === undefined || t < first[u])) first[u] = t;
  const rows = [...new Set(g.timeline.map(x => x[0]))].sort((a, b) => (first[a] ?? 9e12) - (first[b] ?? 9e12));
  const shown = rows.slice(0, 60), y = Object.fromEntries(shown.map((u, i) => [u, i]));
  const ts = g.timeline.map(x => x[1]), t0 = Math.min(...ts), t1 = Math.max(...ts), W = 600, L = 4, R = 4, rh = 6;
  const H = shown.length * rh + 24, X = t => L + (t - t0) / Math.max(t1 - t0, 1) * (W - L - R);
  const dots = g.timeline.filter(x => x[0] in y).sort((a, b) => a[2] - b[2]).map(([u, t, s]) =>
    `<circle cx="${X(t).toFixed(1)}" cy="${y[u] * rh + 4}" r="${s ? 2.2 : 1.5}" fill="${s ? 'var(--series-2)' : 'var(--other)'}"><title>${esc(who(g.members[u].id))} ${when(t)}</title></circle>`).join('');
  const ticks = [0, .5, 1].map(f => { const t = t0 + f * (t1 - t0), x = X(t);
    return `<line x1="${x}" x2="${x}" y1="0" y2="${H - 18}" stroke="var(--grid)"/><text x="${x}" y="${H - 4}" text-anchor="${f === 0 ? 'start' : f === 1 ? 'end' : 'middle'}">${when(t).slice(0, 16)}</text>`; }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block">${ticks}${dots}</svg>` +
    (rows.length > shown.length ? `<p class="muted" style="font-size:13px">First ${shown.length} of ${rows.length} accounts shown.</p>` : '');
}

function heat(h) {
  const max = Math.max(...h, 1), days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  let s = '<div class="l"></div>' + Array.from({ length: 24 }, (_, i) => `<div class="l">${i % 6 ? '' : i}</div>`).join('');
  days.forEach((d, di) => { s += `<div class="l">${d}</div>`; for (let i = 0; i < 24; i++) { const v = h[di * 24 + i];
    s += `<div title="${d} ${i}:00 UTC: ${v} posts" style="background:rgba(42,120,214,${v ? .12 + .88 * v / max : 0.05})"></div>`; } });
  $('heat').innerHTML = `<div class="heat">${s}</div>`;
  // quietest 6 hours of the day; if that is night (01–07 local), local time = UTC + (4 - centre)
  const byHour = Array.from({ length: 24 }, (_, i) => days.reduce((a, _, d) => a + h[d * 24 + i], 0));
  if (D.end - D.start < 3 * 86400) return $('tz').textContent = 'The data covers less than 3 days, so quiet hours do not show a time zone.';
  if (byHour.reduce((a, b) => a + b, 0) < 50) return $('tz').textContent = 'Too few posts to guess a time zone.';
  let best = 0, bv = Infinity;
  for (let i = 0; i < 24; i++) { const v = [0, 1, 2, 3, 4, 5].reduce((a, j) => a + byHour[(i + j) % 24], 0); if (v < bv) { bv = v; best = i; } }
  let off = ((4 - (best + 3)) % 24 + 24) % 24; if (off > 12) off -= 24;
  const pad = x => String(x).padStart(2, '0');
  $('tz').textContent = `Quietest 6 hours: ${pad(best)}:00–${pad((best + 6) % 24)}:00 UTC. If that is night, the accounts keep the hours of about UTC${off >= 0 ? '+' : '−'}${Math.abs(off)}. A hint, not proof.`;
}

function viewKey(kind, key) {

// ---------- exports ----------
function download(file, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type })); a.download = file; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
const csv = rows => rows.map(r => r.map(v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
const xml = s => esc(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
function exportGroup(g, what) {
  const base = `${name}-group-${g.g}`;
  if (what === 'members') download(base + '-members.csv', csv([['id', 'handle', 'name', 'created', 'followers', 'total_posts', 'posts_here', 'first_here', 'last_here', 'gone', 'label', 'category', 'profile_url'],
    ...g.members.map(m => [m.id, m.handle, m.name, m.created, m.followers, m.total_posts, m.posts, when(m.first), when(m.last), m.gone ? 1 : '', m.label, m.category, profileUrl(m.id)])]), 'text/csv');
  if (what === 'evidence') download(base + '-evidence.csv', csv([['kind', 'trace', 'members', 'in_all_data', 'account', 'post_id', 'time_utc', 'post_url', 'text'],
    ...g.keys.flatMap(k => (k.posts || [{}]).map(p => [keyInfo(k).label, k.kind === 'dup' ? k.sample : k.key, k.users, k.fan, p.u, p.id, p.ts && when(p.ts), p.id && postUrl(p.id, p.u), p.text]))]), 'text/csv');
  if (what === 'graphml') {
    const attrs = ['w', 'dup', 'item', 'tgt', 'fast', 'sched'];
    download(base + '.graphml', `<?xml version="1.0" encoding="UTF-8"?>
<graphml xmlns="http://graphml.graphdrawing.org/xmlns">
<key id="label" for="node" attr.name="label" attr.type="string"/><key id="handle" for="node" attr.name="handle" attr.type="string"/>
<key id="known" for="node" attr.name="known" attr.type="string"/>
${attrs.map(a => `<key id="${a}" for="edge" attr.name="${a}" attr.type="double"/>`).join('')}
<graph id="${xml(base)}" edgedefault="undirected">
${g.members.map(m => `<node id="${xml(m.id)}"><data key="label">${xml(who(m.id))}</data><data key="handle">${xml(m.handle || '')}</data><data key="known">${xml(m.category ?? m.label ?? '')}</data></node>`).join('\n')}
${g.edges.map(e => `<edge source="${xml(e.u)}" target="${xml(e.v)}">${attrs.map(a => `<data key="${a}">${e[a]}</data>`).join('')}</edge>`).join('\n')}
</graph></graphml>`, 'application/xml');
  }
  if (what === 'json') download(base + '.json', JSON.stringify({ dataset: D.name, source: D.source, generated: D.generated, platform: D.platform,
    method: 'Accounts are linked by rare shared traces (same text, links, hashtags, mentions, reposts, reply targets, posts within 60 s), weighted by weekly schedule similarity, then grouped with Leiden clustering. It flags behavior, not opinions.',
    group: g }, null, 1), 'application/json');
}

/* ---------- glossary: every term a beginner may not know gets a hover explanation ---------- */
const GLOSSARY = {
  // troll jobs in the X data (from the Clemson University researchers who sorted the accounts)
  'right-wing trolls': 'Russian troll accounts that pretended to be conservative Americans. They posted pro-Trump, nationalist and anti-immigrant messages.',
  'left-wing trolls': 'Russian troll accounts that pretended to be liberal Americans, often Black activists. They posted about race and identity and attacked mainstream Democrats.',
  'non-English trolls': 'Russian troll accounts that posted mostly in Russian, German or other languages, aimed at people outside the United States.',
  'fake local-news accounts': 'Russian troll accounts that pretended to be local news sites (with names like a city plus "Today"). They posted real local headlines to earn trust.',
  'hashtag-game trolls': 'Russian troll accounts that joined popular Twitter word games (like #MyOlympicSportWouldBe) to look like normal people and gain followers, sometimes slipping in politics.',
  'fear-spreading trolls': 'Russian troll accounts that spread made-up emergencies, like a fake food-poisoning outbreak, to scare people.',
  'advertising accounts': 'Accounts that posted ads and sales posts.',
  'trolls with an unknown job': 'Troll accounts the researchers could not sort into a job.',
  // topics
  'Politics': 'Their posts are mostly about elections, governments, wars or political sides.',
  'Scam': 'Their posts mostly try to get money or clicks: fake giveaways, crypto, "send money", fake deals.',
  'Adult content': 'Their posts mostly advertise sexual content. Spam networks often do this.',
  'Other topics': 'Their posts are about something else: sports, news, games, everyday life.',
  // everyday words in this topic
  'troll farm': 'An office where people are paid to run many fake social media accounts.',
  'Internet Research Agency': 'A Russian company in St. Petersburg that ran thousands of fake social media accounts, including to influence the 2016 US election.',
  'propaganda': 'Messages made to push people toward a belief, often by hiding who is behind them or by bending the truth.',
  'trolls': 'Fake accounts run by people pretending to be someone else, to fool or stir up others.',
  'troll': 'A fake account run by a person pretending to be someone else, to fool or stir up others.',
  'answer key': 'Information we already know for sure, like accounts researchers or the platform already identified. We use it to check whether PropNET got it right.',
  'bots': 'Accounts run by a computer program instead of a person.',
  'bot': 'An account run by a computer program instead of a person.',
  'hashtags': 'Words starting with #, like #election. Clicking one shows everyone using it.',
  'hashtag': 'A word starting with #, like #election. Clicking one shows everyone using it.',
  'reposts': 'Sharing someone else\'s post on your own page (called a retweet on X).',
  'reposted': 'Shared someone else\'s post on their own page (called a retweet on X).',
  'mentions': 'Tagging another account in a post with @, like @someone.',
  'mentioned': 'Tagged another account in a post with @, like @someone.',
  'UTC': 'World time, the same everywhere. Chicago is 6 hours behind UTC in winter, London is the same as UTC.',
  'Bluesky': 'A social network similar to X (Twitter). Its posts are public, so anyone can study them.',
  'Telegram': 'A messaging app with public channels, very popular in Russia and Ukraine.',
  'firehose': 'The live stream of every new public post on Bluesky, about 40 posts a second.',
  'display name': 'The name shown on an account\'s profile, which can be anything, unlike the @handle.',
  'profiles': 'The page about an account: its name, picture and short description.',
  'Random groups': 'Groups made by shuffling accounts randomly. They show what the result would look like by pure luck.',
  'picked at random': 'Chosen by pure luck, without PropNET. This shows what you would get by guessing.',
  'operator': 'The person or group secretly running the accounts.',
  'state actors': 'Governments, or groups working for a government.',
  // expert words
  'raw score': 'The number PropNET uses to rank groups: how much its members share per member. Higher means more copying. It has no fixed maximum.',
  'shared traces': 'Things two or more members have in common: the same text, link, hashtag, mention, repost or reply.',
  'shared trace': 'Something two or more members have in common: the same text, link, hashtag, mention, repost or reply.',
  'schedule similarity': 'How alike their posting hours are, from 0 (nothing alike) to 1 (exactly the same).',
  'GraphML': 'A file format for networks. It opens in tools like Gephi to draw and study the group.',
  'CSV': 'A simple table file that opens in Excel or Google Sheets.',
  'JSON': 'A data file programmers can read, with everything about the group.',
  'DID': 'A Bluesky account\'s permanent ID. The @handle can change, the DID never does.',
  'Leiden clustering': 'A math method that finds tight groups in a network, like friend circles in a school.',
  'purity': 'How many accounts in a group share the group\'s most common troll job.',
  'cosine': 'A math way to compare two patterns, from 0 (nothing alike) to 1 (identical).',
  'labeled': 'Marked by researchers as a propaganda account.',
};
const GLOSS_TERMS = Object.keys(GLOSSARY).sort((a, b) => b.length - a.length);
const GLOSS_RE = new RegExp('(^|[^\\w-])(' + GLOSS_TERMS.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')(?![\\w-])', 'gi');
const GLOSS_LOWER = Object.fromEntries(GLOSS_TERMS.map(t => [t.toLowerCase(), t]));
// Wrap the first use of each term in each block (card, list item, paragraph...) with a hover explanation
function glossify(root) {
  if (!root) return;
  const SKIP = 'a, code, button, select, option, input, textarea, script, style, svg, .hint, [data-tip], #tip, header, .mono, q, .posts';
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n =>
    !n.nodeValue.trim() || n.parentElement.closest(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  const seen = new WeakMap();
  for (const node of nodes) {
    const block = node.parentElement.closest('.card, li, dd, dt, p, h1, h2, h3, section, td, th, .dotbox, .cluerow') || root;
    let used = seen.get(block);
    if (!used) { used = new Set([...block.querySelectorAll('.hint')].map(h => GLOSS_LOWER[h.textContent.toLowerCase()]).filter(Boolean)); seen.set(block, used); }
    const text = node.nodeValue; let out = '', last = 0, changed = false, m;
    GLOSS_RE.lastIndex = 0;
    while ((m = GLOSS_RE.exec(text))) {
      const word = m[2], key = GLOSS_LOWER[word.toLowerCase()] || word;
      if (!GLOSSARY[key] || used.has(key) || (key === 'DID' && word !== 'DID') || (key === 'UTC' && word !== 'UTC')) continue;
      used.add(key); changed = true;
      const start = m.index + m[1].length;
      out += escG(text.slice(last, start)) + `<span class="hint" tabindex="0" data-tip="${escG(GLOSSARY[key])}">${escG(word)}</span>`;
      last = start + word.length;
    }
    if (!changed) continue;
    const span = document.createElement('span'); span.innerHTML = out + escG(text.slice(last));
    node.replaceWith(...span.childNodes);
  }
}
function escG(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

// ---------- routing ----------
async function route() {
  if (!window.DATASETS) await script('datasets.js').catch(() => {});
  const list = window.DATASETS || [];
  if (!list.length) return $('app').innerHTML = '<p class="muted">No data. Run <code>uv run osint_site.py bluesky "data/live/*.parquet" 3</code>.</p>';
  const [, ds, view, a, ...b] = location.hash.split('/');
  const want = ds ? decodeURIComponent(ds) : list[0];
  if (want !== name) {
    D = await load(want); name = want; index(); page = 0;
    $('ds').innerHTML = list.map(n => `<option value="${esc(n)}" ${n === name ? 'selected' : ''}>${esc(NAMES[n] || n)}</option>`).join('');
  }
  scrollTo(0, 0);
  if (view !== 's') $('q').value = '';
  if (view === 'g') viewGroup(a);
  else if (view === 'u') viewUser(decodeURIComponent(a));
  else if (view === 'k') viewKey(a, decodeURIComponent(b.join('/')));
  else if (view === 's') { $('q').value = decodeURIComponent(a); viewSearch(decodeURIComponent(a)); }
  else viewList();
  glossify($('app'));
}

$('q').onkeydown = e => { if (e.key === 'Enter' && $('q').value.trim()) location.hash = `#/${enc(name)}/s/${enc($('q').value.trim())}`; };
const T = $('tip');
const showTip = (h, x, y) => { if (!h) { T.style.opacity = 0; return; } T.innerHTML = h.dataset.tip; T.style.opacity = 1;
  const r = T.getBoundingClientRect(); T.style.left = Math.max(8, Math.min(innerWidth - r.width - 8, x + 14)) + 'px'; T.style.top = Math.min(innerHeight - r.height - 8, y + 14) + 'px'; };
document.addEventListener('mousemove', e => showTip(e.target.closest('[data-tip]'), e.clientX, e.clientY));
document.addEventListener('focusin', e => { const h = e.target.closest('[data-tip]'); if (!h) return showTip(null); const r = h.getBoundingClientRect(); showTip(h, r.left, r.bottom); });
document.addEventListener('focusout', () => showTip(null));
// the project pages exist only on the public site (docs/); hide their links elsewhere
fetch('method.html', { method: 'HEAD' }).then(r => { if (!r.ok) throw 0; }).catch(() => document.querySelectorAll('.proj').forEach(a => a.remove()));
glossify(document.querySelector('.notice'));
addEventListener('hashchange', route);
route().catch(e => $('app').textContent = 'Could not load the data: ' + e);
</script>
